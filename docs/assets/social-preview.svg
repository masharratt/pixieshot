<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.8" cy="0.25" r="0.45">
      <stop offset="0" stop-color="#f0abfc" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f0abfc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.15" cy="0.9" r="0.4">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glowA)"/>
  <rect width="1280" height="640" fill="url(#glowB)"/>

  <!-- soft layered shadow under the window -->
  <g transform="translate(700 150) rotate(-5)">
    <rect x="10" y="44" width="470" height="330" rx="30" fill="#000" fill-opacity="0.10"/>
    <rect x="6" y="32" width="470" height="330" rx="30" fill="#000" fill-opacity="0.12"/>
    <rect x="3" y="20" width="470" height="330" rx="30" fill="#000" fill-opacity="0.14"/>
    <!-- glass bezel -->
    <rect x="-18" y="-18" width="506" height="366" rx="40" fill="url(#glass)" stroke="url(#rim)" stroke-width="2"/>
    <!-- window -->
    <rect width="470" height="330" rx="24" fill="#1e1b4b" fill-opacity="0.92"/>
    <circle cx="32" cy="30" r="8" fill="#ff5f57"/>
    <circle cx="58" cy="30" r="8" fill="#febc2e"/>
    <circle cx="84" cy="30" r="8" fill="#28c840"/>
    <rect x="32" y="74" width="270" height="18" rx="9" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="32" y="110" width="400" height="13" rx="6.5" fill="#ffffff" fill-opacity="0.40"/>
    <rect x="32" y="136" width="350" height="13" rx="6.5" fill="#ffffff" fill-opacity="0.40"/>
    <rect x="32" y="162" width="380" height="13" rx="6.5" fill="#ffffff" fill-opacity="0.40"/>
    <rect x="32" y="206" width="170" height="80" rx="14" fill="#f472b6"/>
    <rect x="222" y="206" width="110" height="80" rx="14" fill="#a78bfa" fill-opacity="0.85"/>
    <path d="M300 300 L405 248" stroke="#fde047" stroke-width="8" stroke-linecap="round"/>
    <path d="M388 236 L410 246 L396 266" fill="none" stroke="#fde047" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- sparkles -->
  <path transform="translate(640 120) scale(2.2)" d="M0-10C1-3 3-1 10 0C3 1 1 3 0 10C-1 3-3 1-10 0C-3-1-1-3 0-10Z" fill="#fff"/>
  <path transform="translate(1210 520) scale(1.6)" d="M0-10C1-3 3-1 10 0C3 1 1 3 0 10C-1 3-3 1-10 0C-3-1-1-3 0-10Z" fill="#fff" fill-opacity="0.85"/>
  <path transform="translate(1185 95) scale(1.1)" d="M0-10C1-3 3-1 10 0C3 1 1 3 0 10C-1 3-3 1-10 0C-3-1-1-3 0-10Z" fill="#fff" fill-opacity="0.7"/>
  <path transform="translate(660 560) scale(0.9)" d="M0-10C1-3 3-1 10 0C3 1 1 3 0 10C-1 3-3 1-10 0C-3-1-1-3 0-10Z" fill="#fff" fill-opacity="0.6"/>

  <text x="80" y="270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="112" font-weight="bold" fill="#ffffff">Pixieshot</text>
  <text x="86" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" fill="#fbcfe8">Screenshots for Mac that sparkle</text>
  <text x="86" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#e9d5ff">Beautify · Copy text · Scrolling capture</text>
  <text x="86" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#e9d5ff">GIF &amp; MP4 recording with trim</text>
  <rect x="86" y="500" width="300" height="52" rx="26" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.5"/>
  <text x="236" y="535" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Free · Open source</text>
</svg>
